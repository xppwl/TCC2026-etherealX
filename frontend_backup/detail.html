<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detalhes — Ethereal X</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main" id="detalheContainer">
    <div class="player-wrap" id="playerWrap">
      <div class="loader"><span class="spin"></span> Carregando player...</div>
    </div>

    <div class="detail-hero" id="detailHero">
      <div class="detail-hero-content">
        <div class="detail-tags" id="detailTags"></div>
        <h1 class="detail-title" id="detailTitle">Carregando...</h1>
        <p class="detail-desc" id="detailDesc"></p>
        <div class="detail-actions">
          <button class="btn btn-ghost" id="btnFavorito" onclick="alternarFavorito()">🤍 Favoritar</button>
          <button class="btn btn-ghost" id="btnLista" onclick="alternarMinhaLista()">➕ Minha Lista</button>
        </div>
      </div>
    </div>

    <section class="row-section" id="secaoEpisodios">
      <div class="row-head"><h2>Episódios</h2></div>
      <div class="episode-list" id="listaEpisodios"></div>
    </section>
  </main>
</div>

<script src="js/eye-logo.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/detail.js"></script>
<script>iniciarDetalhes();</script>
</body>
</html>
