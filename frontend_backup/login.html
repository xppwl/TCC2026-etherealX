<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Acesse sua conta Ethereal X — a plataforma de streaming com filmes e séries premium." />
  <title>Entrar — Ethereal X</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-center-page">
  <div class="auth-card">
    <div class="auth-card-brand">
      <div id="logoHost" role="img" aria-label="Logo Ethereal X"></div>
      <div class="brand-name">Ethereal X</div>
    </div>

    <div class="alert alert-error" id="alertaErro" role="alert" aria-live="polite"></div>

    <form id="formLogin" novalidate>
      <div class="field field-icon-wrap">
        <span class="f-ico" aria-hidden="true">✉️</span>
        <input type="email" id="email" name="email" placeholder="Seu e-mail"
               autocomplete="email" required />
      </div>

      <div class="field field-icon-wrap">
        <span class="f-ico" aria-hidden="true">🔒</span>
        <input type="password" id="senha" name="senha" placeholder="••••••"
               autocomplete="current-password" minlength="6" required />
        <button type="button" class="f-toggle" id="toggleSenha"
                aria-label="Mostrar ou ocultar senha" title="Mostrar/ocultar senha">👁</button>
      </div>

      <div class="auth-forgot">
        <a href="#" id="linkEsqueceuSenha">Esqueceu sua senha?</a>
      </div>

      <button type="submit" class="btn-auth-outline" id="btnEntrar">Entrar</button>
    </form>

    <div class="auth-divider-line"></div>

    <button class="google-center-btn" id="btnGoogle" type="button" title="Entrar com Google" aria-label="Entrar com o Google">
      <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.5-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.3 19 12 24 12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3c-7.7 0-14.4 4.4-17.7 10.7z"/>
        <path fill="#4CAF50" d="M24 45c5.2 0 10-2 13.5-5.2l-6.2-5.2C29.3 36.6 26.8 37.5 24 37.5c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.5 40.4 16.2 45 24 45z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.2C40.5 36 44 30.5 44 24c0-1.4-.1-2.5-.4-3.5z"/>
      </svg>
    </button>

    <p class="auth-switch" style="margin-top: 18px; font-size: 12.5px;">Não tem conta? <a href="register.html">Cadastre-se</a></p>
  </div>
</div>

<script src="js/eye-logo.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('logoHost').innerHTML = eyeLogoSVG();
  iniciarLogoEthereal();
  iniciarPaginaLogin();

  // Toggle mostrar/ocultar senha
  document.getElementById('toggleSenha').addEventListener('click', function() {
    const input = document.getElementById('senha');
    const visivel = input.type === 'text';
    input.type = visivel ? 'password' : 'text';
    this.textContent = visivel ? '👁' : '🙈';
    this.setAttribute('aria-label', visivel ? 'Mostrar senha' : 'Ocultar senha');
  });

  // Link "Esqueceu sua senha?"
  document.getElementById('linkEsqueceuSenha').addEventListener('click', function(e) {
    e.preventDefault();
    mostrarToast('Fale com o suporte para redefinir sua senha.');
  });
</script>
</body>
</html>
