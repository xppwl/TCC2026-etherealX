<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Início — Ethereal X</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="topbar home-topbar">
      <div class="search-box home-search">
        <span>🔍</span>
        <input type="text" id="buscaHome" placeholder="Buscar filmes, series..." />
      </div>

      <div class="topbar-right">
        <button class="icon-btn" title="Notificações" aria-label="Notificações">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
        <a class="topbar-user" href="settings.html">
          <span id="saudacaoUsuario">Olá usuário</span>
          <div class="topbar-avatar" id="topbarAvatar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#e91e63">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
          </div>
        </a>
      </div>
    </div>

    <div id="resultadoBusca" style="display:none; margin-bottom:40px;"></div>

    <div class="hero" id="heroSection">
      <div class="loader"><span class="spin"></span> Carregando destaque...</div>
    </div>

    <section class="row-section">
      <div class="row-head">
        <h2>Em alta</h2>
        <a href="movies.html" class="row-head-link">Ver todos</a>
      </div>
      <div class="row-wrapper">
        <div class="row-track" id="trackEmAlta"><div class="loader"><span class="spin"></span></div></div>
        <button class="row-scroll-btn" onclick="document.getElementById('trackEmAlta').scrollBy({left:400, behavior:'smooth'})" aria-label="Rolar para a direita">▶</button>
      </div>
    </section>

    <section class="row-section">
      <div class="row-head">
        <h2>Tendência</h2>
        <a href="movies.html" class="row-head-link">Ver todos</a>
      </div>
      <div class="row-wrapper">
        <div class="row-track" id="trackTendencia"><div class="loader"><span class="spin"></span></div></div>
        <button class="row-scroll-btn" onclick="document.getElementById('trackTendencia').scrollBy({left:400, behavior:'smooth'})" aria-label="Rolar para a direita">▶</button>
      </div>
    </section>
  </main>
</div>

<script src="js/eye-logo.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/catalog.js"></script>
<script>iniciarHome();</script>
</body>
</html>
